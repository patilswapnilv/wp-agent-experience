name: Feature Request
description: Propose a new capability, CLI command, MCP tool, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make WordPress easier for AI coding agents to evaluate, scaffold, verify, or deploy? Tell us about it below.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - wpai-cli (CLI commands)
        - wpai mcp (MCP server)
        - wpai export (production parity & security)
        - Platform-selection skill / capability registry
        - Benchmark harness / evaluation
        - Documentation / DX
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What workflow friction or gap does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the CLI flag, MCP tool, schema change, or behavior you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative designs or workarounds you considered.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to submit a PR for this feature
