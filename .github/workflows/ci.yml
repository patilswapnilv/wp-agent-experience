name: WPAI CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Build, Validate & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build TypeScript CLI
        run: npm run build

      - name: Validate capability registry & all blueprints
        run: npm run validate

      - name: Run Node unit tests
        run: npm test

      - name: Smoke-test packed npm tarball outside repository
        run: npm run test:pack

      - name: Run Python benchmark harness tests
        run: python3 -m unittest discover -s benchmarks/harness -p 'test_*.py' -v

  playground-integration:
    name: Live WordPress Playground Verification
    runs-on: ubuntu-latest
    needs: validate-and-test
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build TypeScript CLI
        run: npm run build

      - name: Verify small-business, commerce, and publishing blueprints in Playground
        run: npm run test:integration
